name: sintius-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sintius
      POSTGRES_USER: sintius_admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sintius_admin -d sintius"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sintius-postgres-data:/var/lib/postgresql/data

volumes:
  sintius-postgres-data:
