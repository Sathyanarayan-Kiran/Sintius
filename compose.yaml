name: sintius-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sintius
      POSTGRES_USER: sintius_admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sintius_admin -d sintius"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sintius-postgres-data:/var/lib/postgresql/data

  # Decision D15: local telemetry backend. OpenTelemetry Collector (OTLP on 4317/4318), Tempo,
  # Prometheus, Loki and Grafana (http://127.0.0.1:3000) in one image. Opt-in: it starts only with
  # `npm run observability:up`, never with `db:up`, and binds to loopback only.
  observability:
    image: grafana/otel-lgtm:0.33.1
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  sintius-postgres-data:
